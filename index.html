<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ameizin Cotizador</title>
    <link rel="icon" type="image/png" href="/cotizador/favicon.png">
    <link rel="apple-touch-icon" href="/cotizador/apple-touch-icon.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Montserrat:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @media print {

            body,
            html {
                height: auto !important;
                overflow: visible !important;
                background: white !important;
            }

            body * {
                visibility: hidden;
            }

            #print-section,
            #print-section * {
                visibility: visible;
            }

            #print-section {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 0;
                background: white;
                border: none;
                box-shadow: none;
            }

            .no-print,
            .print\:hidden {
                display: none !important;
            }

            .modal-content-print-fix {
                position: static !important;
                overflow: visible !important;
                max-height: none !important;
                width: 100% !important;
                transform: none !important;
                box-shadow: none !important;
            }

            ::-webkit-scrollbar {
                display: none;
            }

            @page {
                size: A4;
                margin: 0;
                /* Remove default browser margins */
            }

            /* Safari/iOS fix for repeating headers/footers in print and bad paginations */
            tr,
            td,
            th {
                page-break-inside: avoid !important;
            }

            .page-break-before {
                page-break-before: always !important;
            }

            .avoid-page-break {
                page-break-inside: avoid !important;
            }

            /* Remove margins from the print section itself so it relies on the internal padding */
            #print-section {
                margin: 0 !important;
                padding: 0 !important;
            }
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
